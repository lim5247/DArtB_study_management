<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26여름 방학스터디 인증</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: #eef1ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 6px 32px rgba(80, 90, 200, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .header p {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        /* step indicator */
        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 32px;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e8eaff;
            color: #aaa;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .step-circle.active {
            background: #5c6ff0;
            color: white;
        }

        .step-circle.done {
            background: #b6bcf9;
            color: white;
        }

        .step-label {
            font-size: 11px;
            color: #bbb;
            white-space: nowrap;
        }

        .step-label.active { color: #5c6ff0; font-weight: 600; }

        .step-line {
            width: 40px;
            height: 2px;
            background: #e8eaff;
            margin: 0 4px;
            margin-bottom: 18px;
            transition: background 0.3s;
        }

        .step-line.done { background: #b6bcf9; }

        /* form */
        .form-group { margin-bottom: 18px; }

        label.field-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-bottom: 8px;
        }

        select, input[type="date"], input[type="number"], input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e4e6f0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            background: #fafafa;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            font-family: inherit;
        }

        select:focus, input:focus {
            border-color: #5c6ff0;
            background: white;
        }

        input[type="file"] {
            cursor: pointer;
            padding: 10px 14px;
        }

        /* radio */
        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-card {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 13px;
            border: 1.5px solid #e4e6f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            color: #666;
            user-select: none;
        }

        .radio-card.selected {
            border-color: #5c6ff0;
            background: #f0f2ff;
            color: #5c6ff0;
            font-weight: 700;
        }

        /* photo preview */
        .photo-preview {
            display: none;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1.5px solid #e4e6f0;
        }

        .photo-preview img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        /* error / warning */
        .error-msg {
            display: none;
            background: #fff4f4;
            border: 1px solid #ffc8c8;
            color: #c0392b;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }

        .error-msg.warning {
            background: #fff8f0;
            border-color: #f39c12;
            color: #e67e22;
        }

        .late-notice {
            display: none;
            background: #fff8f0;
            border: 1px solid #f39c12;
            color: #e67e22;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 16px;
        }

        /* buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary { background: #5c6ff0; color: white; margin-top: 8px; }
        .btn-primary:hover { background: #4a5de0; }
        .btn-primary:disabled { background: #b6bcf9; cursor: not-allowed; }

        .btn-secondary { background: #f0f1f5; color: #666; margin-top: 8px; }
        .btn-secondary:hover { background: #e4e5ec; }

        /* loading */
        .loading {
            display: none;
            text-align: center;
            color: #888;
            font-size: 13px;
            padding: 8px 0;
        }

        .loading::before {
            content: "";
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ddd;
            border-top-color: #5c6ff0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* success */
        .success-screen {
            display: none;
            text-align: center;
            padding: 16px 0;
        }

        .success-icon {
            font-size: 56px;
            margin-bottom: 14px;
        }

        .success-screen h2 {
            font-size: 20px;
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .success-screen p {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
        }

        .summary-box {
            background: #f5f6ff;
            border-radius: 10px;
            padding: 14px 16px;
            margin: 18px 0 0;
            text-align: left;
            font-size: 13px;
            color: #555;
            line-height: 1.9;
        }

        .summary-box strong { color: #333; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>📚 방학스터디 인증</h1>
        <p>다트비 7기 · 26여름</p>
    </div>

    <!-- Step indicator -->
    <div class="steps">
        <div class="step-item">
            <div class="step-circle active" id="sc1">1</div>
            <div class="step-label active" id="sl1">응답자</div>
        </div>
        <div class="step-line" id="line1"></div>
        <div class="step-item">
            <div class="step-circle" id="sc2">2</div>
            <div class="step-label" id="sl2">스터디 정보</div>
        </div>
        <div class="step-line" id="line2"></div>
        <div class="step-item">
            <div class="step-circle" id="sc3">3</div>
            <div class="step-label" id="sl3">인증 정보</div>
        </div>
        <div class="step-line" id="line3"></div>
        <div class="step-item">
            <div class="step-circle" id="sc4">4</div>
            <div class="step-label" id="sl4">완료</div>
        </div>
    </div>

    <!-- Step 1: 기수 + 응답자명 -->
    <div id="step1">
        <div class="form-group">
            <label class="field-label">기수</label>
            <div class="radio-group">
                <div class="radio-card" id="opt-5" onclick="selectGen('5기')">5기</div>
                <div class="radio-card" id="opt-6" onclick="selectGen('6기')">6기</div>
                <div class="radio-card" id="opt-7" onclick="selectGen('7기')">7기</div>
            </div>
        </div>
        <div class="form-group">
            <label class="field-label" for="respondent">응답자명</label>
            <input type="text" id="respondent" placeholder="이름을 입력하세요">
        </div>
        <div class="error-msg" id="err1"></div>
        <button class="btn btn-primary" onclick="goStep2()">다음</button>
    </div>

    <!-- Step 2: 스터디명 + 날짜 -->
    <div id="step2" style="display:none;">
        <div class="form-group">
            <label class="field-label" for="study-name">스터디명</label>
            <select id="study-name">
                <option value="">스터디를 선택하세요</option>
                <option value="하루아빠">하루아빠</option>
                <option value="캐치캐치">캐치캐치</option>
                <option value="REDRED">REDRED</option>
                <option value="전진정">전진정</option>
                <option value="데굴데굴">데굴데굴</option>
                <option value="빅변기">빅변기</option>
                <option value="은영은우">은영은우</option>
                <option value="QWER">QWER</option>
            </select>
        </div>
        <div class="form-group">
            <label class="field-label" for="study-date">스터디 진행 일자</label>
            <input type="date" id="study-date">
        </div>
        <div class="error-msg" id="err2"></div>
        <button class="btn btn-primary" onclick="goStep3()">다음</button>
        <button class="btn btn-secondary" onclick="goStep1()">이전으로</button>
    </div>

    <!-- Step 3: 대면/비대면 + 참여인원 + 사진 -->
    <div id="step3" style="display:none;">
        <div class="late-notice" id="late-notice">⚠️ 지연 인증 — 인증 기간이 지났습니다</div>
        <div class="form-group">
            <label class="field-label">진행 방식</label>
            <div class="radio-group">
                <div class="radio-card" id="opt-offline" onclick="selectMode('offline')">🏢 대면</div>
                <div class="radio-card" id="opt-online" onclick="selectMode('online')">💻 비대면</div>
            </div>
        </div>
        <div class="form-group">
            <label class="field-label" for="participants">참여 인원</label>
            <input type="number" id="participants" min="1" max="30" placeholder="참여 인원 수 입력">
        </div>
        <div class="form-group">
            <label class="field-label" for="photo">인증 사진</label>
            <input type="file" id="photo" accept="image/*" onchange="previewPhoto(this)">
            <div class="photo-preview" id="photo-preview">
                <img id="preview-img" src="" alt="인증 사진 미리보기">
            </div>
        </div>
        <div class="error-msg" id="err3"></div>
        <div class="loading" id="loading">제출 중입니다...</div>
        <button class="btn btn-primary" id="submit-btn" onclick="submitForm()">인증 제출</button>
        <button class="btn btn-secondary" onclick="goStep2back()">이전으로</button>
    </div>

    <!-- Step 4: 완료 -->
    <div class="success-screen" id="step4">
        <div class="success-icon">✅</div>
        <h2>인증 완료!</h2>
        <p>스터디 인증이 정상적으로 기록되었습니다.</p>
        <div class="summary-box" id="summary-box"></div>
        <button class="btn btn-secondary" onclick="resetForm()" style="margin-top: 20px;">다시 인증하기</button>
    </div>
</div>

<script>
    const CERT_PERIODS = [
        { round: "1주차", start: "2026-07-14", end: "2026-07-20" },
        { round: "2주차", start: "2026-07-21", end: "2026-07-27" },
        { round: "3주차", start: "2026-07-28", end: "2026-08-03" },
        { round: "4주차", start: "2026-08-04", end: "2026-08-10" },
        { round: "5주차", start: "2026-08-11", end: "2026-08-17" },
        { round: "6주차", start: "2026-08-18", end: "2026-08-24" },
        { round: "7주차", start: "2026-08-25", end: "2026-08-31" },
    ];

    // ─────────────────────────────────────────
    // TODO: Google Apps Script Web App URL을 아래에 입력하세요
    // ─────────────────────────────────────────
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzCr2NozO4E91MCuwtf3eLwvh0EwxymfKyOZmJ7E2U1iHLpxvPOiCNtukImZbtfKhQ/exec";

    let selectedGen   = "";
    let selectedMode  = "";
    let matchedPeriod = null;
    let isLate        = false;

    function getTodayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
    }

    function findPeriod(dateStr) {
        return CERT_PERIODS.find(p => dateStr >= p.start && dateStr <= p.end) || null;
    }

    // ── 기수 선택 ──
    function selectGen(gen) {
        selectedGen = gen;
        ["5기","6기","7기"].forEach(g => {
            document.getElementById(`opt-${g[0]}`).classList.toggle("selected", g === gen);
        });
    }

    // ── Step 1 → 2 ──
    function goStep2() {
        const respondent = document.getElementById("respondent").value.trim();
        const err = document.getElementById("err1");

        if (!selectedGen) return showErr(err, "기수를 선택해주세요.");
        if (!respondent)  return showErr(err, "응답자명을 입력해주세요.");

        err.style.display = "none";
        show("step2"); hide("step1");
        setStep(2);
    }

    // ── Step 2 → 1 ──
    function goStep1() {
        document.getElementById("err2").style.display = "none";
        show("step1"); hide("step2");
        setStep(1);
    }

    // ── Step 2 → 3 ──
    function goStep3() {
        const name = document.getElementById("study-name").value;
        const date = document.getElementById("study-date").value;
        const err  = document.getElementById("err2");

        if (!name) return showErr(err, "스터디명을 선택해주세요.");
        if (!date) return showErr(err, "스터디 진행 일자를 선택해주세요.");

        const period = findPeriod(date);
        if (!period) return showErr(err, "26-여름방학 스터디 진행 기간이 아닙니다.");

        const today = getTodayStr();
        if (today < period.start) {
            return showErr(err, "해당 주차 인증 기간이 아닙니다.");
        } else if (today > period.end) {
            isLate = true;
            showWarn(err, `지연 인증입니다. ${period.round} 인증 기간(${period.start} ~ ${period.end})이 종료되었습니다.`);
        } else {
            isLate = false;
            err.style.display = "none";
        }

        matchedPeriod = period;
        document.getElementById("late-notice").style.display = isLate ? "block" : "none";
        show("step3"); hide("step2");
        setStep(3);
    }

    // ── Step 3 → 2 ──
    function goStep2back() {
        document.getElementById("err3").style.display = "none";
        show("step2"); hide("step3");
        setStep(2);
    }

    // ── 진행 방식 선택 ──
    function selectMode(mode) {
        selectedMode = mode;
        document.getElementById("opt-offline").classList.toggle("selected", mode === "offline");
        document.getElementById("opt-online").classList.toggle("selected", mode === "online");
    }

    // ── 사진 미리보기 ──
    function previewPhoto(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById("preview-img").src = e.target.result;
            document.getElementById("photo-preview").style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    // ── 제출 ──
    async function submitForm() {
        const participants = document.getElementById("participants").value;
        const photoFile    = document.getElementById("photo").files[0];
        const err          = document.getElementById("err3");

        if (!selectedMode) return showErr(err, "대면/비대면 여부를 선택해주세요.");
        if (!participants || Number(participants) < 1) return showErr(err, "참여 인원을 입력해주세요.");
        if (!photoFile)    return showErr(err, "인증 사진을 첨부해주세요.");

        err.style.display = "none";
        const submitBtn = document.getElementById("submit-btn");
        const loading   = document.getElementById("loading");
        submitBtn.disabled = true;
        loading.style.display = "block";

        try {
            const processedFile = await resizeIfNeeded(photoFile);
            const photoBase64   = await toBase64(processedFile);

            const payload = {
                token:        "dartb2026",
                generation:   selectedGen,
                respondent:   document.getElementById("respondent").value.trim(),
                studyName:    document.getElementById("study-name").value,
                studyDate:    document.getElementById("study-date").value,
                round:        matchedPeriod.round,
                mode:         selectedMode,
                participants: Number(participants),
                photoBase64:  photoBase64,
                photoName:    processedFile.name,
                isLate:       isLate,
                submitDate:   getTodayStr(),
            };

            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload),
            });

            const result = await res.json();
            if (result.status !== "success") throw new Error(result.message || "서버 오류");

            showSuccess(payload);
        } catch (e) {
            loading.style.display = "none";
            submitBtn.disabled = false;
            showErr(err, "제출 중 오류가 발생했습니다: " + e.message);
        }
    }

    // 5MB 초과 시 Canvas로 리사이징
    async function resizeIfNeeded(file) {
        const MAX_BYTES = 5 * 1024 * 1024;
        if (file.size <= MAX_BYTES) return file;

        const MAX_DIM = 1920;

        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(file);

            img.onload = () => {
                URL.revokeObjectURL(url);

                let { width, height } = img;
                const scale = Math.min(MAX_DIM / width, MAX_DIM / height, 1);
                width  = Math.round(width  * scale);
                height = Math.round(height * scale);

                const canvas = document.createElement("canvas");
                canvas.width  = width;
                canvas.height = height;
                canvas.getContext("2d").drawImage(img, 0, 0, width, height);

                // quality 0.85로 시도, 여전히 크면 0.7로 재시도
                canvas.toBlob((blob) => {
                    if (blob.size <= MAX_BYTES) {
                        resolve(new File([blob], file.name, { type: "image/jpeg" }));
                    } else {
                        canvas.toBlob((blob2) => {
                            resolve(new File([blob2], file.name, { type: "image/jpeg" }));
                        }, "image/jpeg", 0.7);
                    }
                }, "image/jpeg", 0.85);
            };

            img.src = url;
        });
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(",")[1]);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function showSuccess(payload) {
        document.getElementById("loading").style.display = "none";
        hide("step3");

        const modeLabel = payload.mode === "offline" ? "대면" : "비대면";
        document.getElementById("summary-box").innerHTML =
            `<strong>기수</strong>  ${payload.generation}<br>` +
            `<strong>응답자</strong>  ${payload.respondent}<br>` +
            `<strong>스터디명</strong>  ${payload.studyName}<br>` +
            `<strong>진행 일자</strong>  ${payload.studyDate} (${payload.round})<br>` +
            `<strong>진행 방식</strong>  ${modeLabel}<br>` +
            `<strong>참여 인원</strong>  ${payload.participants}명`;

        show("step4");
        setStep(4);
    }

    function resetForm() {
        document.getElementById("respondent").value = "";
        document.getElementById("study-name").value = "";
        document.getElementById("study-date").value = "";
        document.getElementById("participants").value = "";
        document.getElementById("photo").value = "";
        document.getElementById("photo-preview").style.display = "none";
        ["err1","err2","err3"].forEach(id => document.getElementById(id).style.display = "none");
        document.getElementById("submit-btn").disabled = false;
        document.getElementById("loading").style.display = "none";
        selectedGen = ""; selectedMode = ""; matchedPeriod = null; isLate = false;
        ["opt-5","opt-6","opt-7","opt-offline","opt-online"].forEach(id =>
            document.getElementById(id).classList.remove("selected")
        );
        hide("step4"); show("step1");
        setStep(1);
    }

    function showErr(el, msg) {
        el.textContent = msg;
        el.classList.remove("warning");
        el.style.display = "block";
    }

    function showWarn(el, msg) {
        el.textContent = msg;
        el.classList.add("warning");
        el.style.display = "block";
    }

    function show(id) { document.getElementById(id).style.display = "block"; }
    function hide(id) { document.getElementById(id).style.display = "none"; }

    function setStep(n) {
        for (let i = 1; i <= 4; i++) {
            document.getElementById(`sc${i}`).classList.toggle("active", i === n);
            document.getElementById(`sc${i}`).classList.toggle("done",   i < n);
            document.getElementById(`sl${i}`).classList.toggle("active", i === n);
        }
        ["line1","line2","line3"].forEach((id, idx) =>
            document.getElementById(id).classList.toggle("done", n > idx + 1)
        );
    }
</script>
</body>
</html>
